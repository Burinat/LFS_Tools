<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blending Bàsic</title><style>:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 22px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num{width:92px;border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;text-align:right;font-size:1rem}.unit{width:34px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.55rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:10px;background:#0b131a;color:var(--text);padding:10px 12px;cursor:pointer}.pill.active{border-color:var(--accent);background:#12332f;color:#d9fff5}.formula{color:var(--muted);text-align:center;margin:17px 0 0}.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);font-size:1rem}@media(max-width:600px){body{padding:14px}.card{padding:16px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.grid{grid-template-columns:1fr}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}}</style></head><body><main class="app"><header class="head"><div><h1>Blending bàsic</h1><p>Estimació de projectors i solapament per cobrir una superfície.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="pills"><button class="pill active" data-a="16:9">16:9</button><button class="pill" data-a="16:10">16:10</button></div><div id="fields"></div><div class="grid"><div class="result"><div class="k">Projectors necessaris</div><div id="num" class="v">—</div></div><div class="result"><div class="k">Amplada per projector</div><div id="pw" class="v">—</div></div><div class="result"><div class="k">Solapament estimat</div><div id="overlap" class="v">—</div></div></div><p class="formula">Càlcul orientatiu amb un solapament mínim del 10% entre imatges.</p></section></main><script>let a='16:9',x={width:15,height:3};const fields=[['width','Amplada de la paret','m',1,50,.1],['height','Alçada de la paret','m',.5,15,.1]];const el=document.querySelector('#fields'),f=v=>(Math.round(v*100)/100).toLocaleString('ca-ES',{maximumFractionDigits:2});function render(){el.innerHTML='';fields.forEach(([k,l,u,min,max,s])=>{let d=document.createElement('div');d.className='field';d.innerHTML=`<label>${l}<output>${f(x[k])} ${u}</output></label><div class="row"><input type="range" min="${min}" max="${max}" step="${s}" value="${x[k]}"><input class="num" type="number" min="${min}" max="${max}" step="${s}" value="${x[k]}"><span class="unit">${u}</span></div>`;el.append(d);let r=d.querySelector('input[type=range]'),n=d.querySelector('.num'),o=d.querySelector('output');let set=v=>{x[k]=Math.min(max,Math.max(min,Number(v)||min));r.value=x[k];n.value=x[k];o.textContent=f(x[k])+' '+u;calc()};r.oninput=e=>set(e.target.value);n.oninput=e=>set(e.target.value)});calc()}function calc(){let [aw,ah]=a.split(':').map(Number),projWidth=x.height*aw/ah,n=Math.max(1,Math.ceil(x.width/(projWidth*.9))),cover=x.width/n,overlap=Math.max(0,projWidth-cover);document.querySelector('#num').textContent=n;document.querySelector('#pw').textContent=f(cover)+' m';document.querySelector('#overlap').textContent=f(overlap)+' m'}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{a=b.dataset.a;document.querySelectorAll('.pill').forEach(q=>q.classList.toggle('active',q===b));calc()});render();</script></body></html>
