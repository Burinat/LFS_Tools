<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lúmens per entorn</title><style>:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff;--yellow:#ffc66d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 22px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num,.select{border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;font-size:1rem}.num{width:96px;text-align:right}.select{width:100%}.unit{width:36px;color:var(--muted)}.note{margin:7px 0 0;color:var(--muted);font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.5rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:10px;background:#0b131a;color:var(--text);padding:10px 12px;cursor:pointer}.pill.active{border-color:var(--accent);background:#12332f;color:#d9fff5}.formula{color:var(--muted);text-align:center;margin:17px 0 0}.warning{color:var(--yellow)!important}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{display:block;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(16,24,32,.94);transition:.15s}.tile:hover{border-color:var(--accent);transform:translateY(-2px)}.tile h2{font-size:1.25rem;margin:0 0 7px;color:var(--accent)}.tile p{margin:0;color:var(--muted);line-height:1.4}.category{margin:26px 0 11px;color:var(--muted);font-size:.85rem;letter-spacing:.09em;text-transform:uppercase}@media(max-width:600px){body{padding:14px}.card{padding:16px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.grid,.menu{grid-template-columns:1fr}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}.tile{padding:16px}}</style></head><body><main class="app"><header class="head"><div><h1>Lúmens per entorn</h1><p>Calcula la il·luminació resultant sobre una superfície.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="field"><label>Entorn</label><select class="select" id="env"><option value="80,200">Cinema / foscor controlada · 80–200 lux</option><option value="300,700" selected>Corporatiu / sala il·luminada · 300–700 lux</option><option value="1000,2500">Exterior / llum ambiental alta · 1.000–2.500 lux</option></select></div><div id="fields"></div><div class="grid"><div class="result"><div class="k">Lluminositat</div><div id="lux" class="v">—</div></div><div class="result"><div class="k">Rang recomanat</div><div id="range" class="v">—</div></div><div class="result"><div class="k">Potència per assolir mínim</div><div id="need" class="v">—</div></div></div><p id="status" class="formula"></p></section></main><script>let x={lumens:10000,distance:8,area:20};const defs=[['lumens','Lúmens del projector','lm',1000,60000,100],['distance','Distància de projecció','m',1,50,.1],['area','Àrea de projecció','m²',1,200,.1]];let box=document.querySelector('#fields');const f=v=>(Math.round(v*10)/10).toLocaleString('ca-ES',{maximumFractionDigits:1});function render(){box.innerHTML='';defs.forEach(([k,l,u,min,max,s])=>{let d=document.createElement('div');d.className='field';d.innerHTML=`<label>${l}<output>${f(x[k])} ${u}</output></label><div class="row"><input type="range" min="${min}" max="${max}" step="${s}" value="${x[k]}"><input class="num" type="number" min="${min}" max="${max}" step="${s}" value="${x[k]}"><span class="unit">${u}</span></div>`;box.append(d);let r=d.querySelector('input[type=range]'),n=d.querySelector('.num'),o=d.querySelector('output'),set=v=>{x[k]=Math.max(min,Math.min(max,Number(v)||min));r.value=x[k];n.value=x[k];o.textContent=f(x[k])+' '+u;calc()};r.oninput=e=>set(e.target.value);n.oninput=e=>set(e.target.value)});calc()}function calc(){let [min,max]=document.querySelector('#env').value.split(',').map(Number),lux=x.lumens/x.area;document.querySelector('#lux').textContent=f(lux)+' lux';document.querySelector('#range').textContent=min+'–'+max+' lux';document.querySelector('#need').textContent=f(min*x.area)+' lm';let s=document.querySelector('#status');s.textContent=lux<min?'Per sota del mínim recomanat.':lux>max?'Per sobre del rang recomanat.':'Dins del rang recomanat.';s.className='formula '+(lux<min?'warning':'')}document.querySelector('#env').onchange=calc;render();</script></body></html>
