<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Delay Calculator</title><style>:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 22px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num{width:92px;border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;text-align:right;font-size:1rem}.unit{width:34px;color:var(--muted)}.note{margin:7px 0 0;color:var(--muted);font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.55rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.formula{color:var(--muted);text-align:center;margin:17px 0 0}@media(max-width:600px){body{padding:14px}.card{padding:16px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.grid{grid-template-columns:1fr}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}}</style></head><body><main class="app"><header class="head"><div><h1>Calculadora de Delay</h1><p>Temps de delay sincronitzat amb el tempo.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div id="fields"></div><div class="grid"><div class="result"><div class="k">Negra · 1/4</div><div id="quarter" class="v">—</div></div><div class="result"><div class="k">Corxera · 1/8</div><div id="eighth" class="v">—</div></div><div class="result"><div class="k">Semicorxera · 1/16</div><div id="sixteenth" class="v">—</div></div><div class="result"><div class="k">Negra amb punt</div><div id="dotted" class="v">—</div></div><div class="result"><div class="k">Treset de negra</div><div id="triplet" class="v">—</div></div><div class="result"><div class="k">Compàs · 1/1</div><div id="bar" class="v">—</div></div></div><p class="formula">Fórmula: 60.000 ÷ BPM = durada d'una negra en ms</p></section></main><script>const x={bpm:120};const f=v=>Math.round(v).toLocaleString('ca-ES');let fields=document.querySelector('#fields');fields.innerHTML=`<div class="field"><label>BPM <output>${x.bpm} BPM</output></label><div class="row"><input type="range" min="40" max="240" step="1" value="${x.bpm}"><input class="num" type="number" min="40" max="240" step="1" value="${x.bpm}"><span class="unit">BPM</span></div><p class="note">Rang: 40–240 BPM</p></div>`;let r=fields.querySelector('input[type=range]'),n=fields.querySelector('.num'),o=fields.querySelector('output');function calc(){let q=60000/x.bpm;[['quarter',q],['eighth',q/2],['sixteenth',q/4],['dotted',q*1.5],['triplet',q*2/3],['bar',q*4]].forEach(([id,v])=>document.querySelector('#'+id).textContent=f(v)+' ms')}function set(v){x.bpm=Math.min(240,Math.max(40,Number(v)||40));r.value=x.bpm;n.value=x.bpm;o.textContent=x.bpm+' BPM';calc()}r.oninput=e=>set(e.target.value);n.oninput=e=>set(e.target.value);calc();</script></body></html>
