<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMX DIP Switch Calculator</title><style>
:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff;--warn:#ffc66d;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:880px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 23px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num{width:100px;border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;text-align:right;font-size:1rem}.unit{width:34px;color:var(--muted)}.dips{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:12px}.dip{border:1px solid var(--line);background:#0b131a;border-radius:12px;padding:13px 5px 11px;color:var(--muted);cursor:pointer;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:.15s}.dip:hover{border-color:var(--accent)}.dip.on{border-color:var(--accent);background:#12332f;color:#d9fff5}.sw{height:38px;width:19px;border-radius:10px;background:#263640;position:relative}.sw:after{content:"";position:absolute;width:13px;height:13px;background:#8ea2b2;border-radius:50%;left:3px;bottom:3px;transition:.15s}.dip.on .sw{background:#216b5a}.dip.on .sw:after{bottom:22px;background:var(--accent);box-shadow:0 0 10px var(--accent)}.dip .n{font-size:.8rem;font-weight:700}.dip .v{font-weight:800;font-size:1.15rem}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.45rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.wide{grid-column:span 3}.state{border-radius:12px;padding:13px 15px;font-weight:700;background:#102c2a;color:var(--accent)}.state.bad{background:#35191d;color:var(--bad)}.formula{color:var(--muted);font-size:.88rem;line-height:1.45;margin:19px 0 0}@media(max-width:650px){body{padding:14px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.card{padding:16px}.dips{grid-template-columns:repeat(3,1fr)}.results{grid-template-columns:1fr}.wide{grid-column:auto}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}}</style></head><body><main class="app"><header class="head"><div><h1>Adreça DMX · DIP Switches</h1><p>Conversió bidireccional d’adreça DMX a commutadors binaris.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="field"><label>Adreça DMX inicial <output id="addressOut">1</output></label><div class="row"><input id="addressRange" type="range" min="1" max="511" step="1" value="1"><input id="addressNum" class="num" type="number" min="1" max="511" step="1" value="1"><span class="unit">DMX</span></div></div><div class="field"><label>Canals del fixture <output id="channelsOut">1 canal</output></label><div class="row"><input id="channelsRange" type="range" min="1" max="64" step="1" value="1"><input id="channelsNum" class="num" type="number" min="1" max="64" step="1" value="1"><span class="unit">ch</span></div></div><div id="dips" class="dips"></div><div class="results"><div class="result"><div class="k">Adreça resultant</div><div id="addressResult" class="v">1</div></div><div class="result"><div class="k">Canals ocupats</div><div id="channelRange" class="v">1–1</div></div><div class="result"><div class="k">DIP activats</div><div id="onDips" class="v">1</div></div><div id="state" class="wide state">Dins de l’univers DMX.</div></div><p id="formula" class="formula">—</p></section></main><script>
const values=[1,2,4,8,16,32,64,128,256];let address=1,channels=1;const dips=document.querySelector('#dips');function build(){dips.innerHTML=values.map((v,i)=>`<button class="dip" data-i="${i}" aria-label="DIP ${i+1}, valor ${v}"><span class="n">DIP ${i+1}</span><span class="sw"></span><span class="v">${v}</span></button>`).join('');dips.querySelectorAll('.dip').forEach(b=>b.onclick=()=>{const v=values[+b.dataset.i];address=(address&v)?address-v:address+v;if(address<1)address=1;sync()})}function sync(){address=Math.max(1,Math.min(511,Math.round(address)||1));channels=Math.max(1,Math.min(64,Math.round(channels)||1));addressRange.value=address;addressNum.value=address;channelsRange.value=channels;channelsNum.value=channels;addressOut.textContent=address;channelsOut.textContent=channels+(channels===1?' canal':' canals');const on=values.map((v,i)=>address&v?i+1:null).filter(Boolean);dips.querySelectorAll('.dip').forEach((b,i)=>b.classList.toggle('on',Boolean(address&values[i])));addressResult.textContent=address;const end=address+channels-1;channelRange.textContent=address+'–'+end;onDips.textContent=on.join(', ')||'—';const st=document.querySelector('#state');if(end>512){st.className='wide state bad';st.textContent=`Atenció: el fixture acaba al canal ${end} i supera el canal 512 de l’univers DMX.`}else{st.className='wide state';st.textContent='Dins de l’univers DMX.'}formula.textContent=`DIP ON: ${on.join(', ')}  ·  ${on.map(i=>values[i-1]).join(' + ')} = ${address}. Els nou DIP representen 1, 2, 4, 8, 16, 32, 64, 128 i 256.`}function setAddress(v){address=Number(v);sync()}function setChannels(v){channels=Number(v);sync()}addressRange.oninput=e=>setAddress(e.target.value);addressNum.oninput=e=>setAddress(e.target.value);channelsRange.oninput=e=>setChannels(e.target.value);channelsNum.oninput=e=>setChannels(e.target.value);build();sync();
</script></body></html>
