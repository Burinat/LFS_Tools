<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de projecció</title><style>:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff;--yellow:#ffc66d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 22px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num,.select{border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;font-size:1rem}.num{width:96px;text-align:right}.select{width:100%}.unit{width:36px;color:var(--muted)}.note{margin:7px 0 0;color:var(--muted);font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.5rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:10px;background:#0b131a;color:var(--text);padding:10px 12px;cursor:pointer}.pill.active{border-color:var(--accent);background:#12332f;color:#d9fff5}.formula{color:var(--muted);text-align:center;margin:17px 0 0}.warning{color:var(--yellow)!important}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{display:block;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;background:rgba(16,24,32,.94);transition:.15s}.tile:hover{border-color:var(--accent);transform:translateY(-2px)}.tile h2{font-size:1.25rem;margin:0 0 7px;color:var(--accent)}.tile p{margin:0;color:var(--muted);line-height:1.4}.category{margin:26px 0 11px;color:var(--muted);font-size:.85rem;letter-spacing:.09em;text-transform:uppercase}@media(max-width:600px){body{padding:14px}.card{padding:16px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.grid,.menu{grid-template-columns:1fr}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}.tile{padding:16px}}</style></head><body><main class="app"><header class="head"><div><h1>Calculadora de projecció</h1><p>Relació de tir, distància i amplada d'imatge.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="pills"><button class="pill active" data-a="16:9">16:9</button><button class="pill" data-a="16:10">16:10</button></div><div class="pills"><button class="pill active" data-m="width">Distància + òptica → amplada</button><button class="pill" data-m="ratio">Amplada + distància → òptica</button><button class="pill" data-m="distance">Òptica + amplada → distància</button></div><div id="fields"></div><div class="grid"><div class="result"><div class="k" id="rl">Amplada</div><div id="r" class="v">—</div></div><div class="result"><div class="k" id="hl">Alçada 16:9</div><div id="h" class="v">—</div></div><div class="result"><div class="k" id="dl">Diagonal 16:9</div><div id="diag" class="v">—</div></div></div><p id="formula" class="formula"></p></section></main><script>let x={d:8,r:1.5,w:5},m='width',a='16:9';const f=v=>(Math.round(v*100)/100).toLocaleString('ca-ES',{maximumFractionDigits:2});const def={d:['Distància de projecció','m',.5,50,.1],r:['Relació de tir',':1',.3,5,.01],w:["Amplada d'imatge",'m',.2,30,.1]};function needs(){return m==='width'?['d','r']:m==='ratio'?['w','d']:['r','w']}function render(){let z=document.querySelector('#fields');z.innerHTML='';needs().forEach(k=>{let [l,u,min,max,s]=def[k],q=document.createElement('div');q.className='field';q.innerHTML=`<label>${l}<output>${f(x[k])} ${u}</output></label><div class="row"><input type="range" min="${min}" max="${max}" step="${s}" value="${x[k]}"><input class="num" type="number" min="${min}" max="${max}" step="${s}" value="${x[k]}"><span class="unit">${u}</span></div>`;z.append(q);let R=q.querySelector('input[type=range]'),N=q.querySelector('.num'),O=q.querySelector('output');let set=v=>{x[k]=Math.max(min,Math.min(max,Number(v)||min));R.value=x[k];N.value=x[k];O.textContent=f(x[k])+' '+u;calc()};R.oninput=e=>set(e.target.value);N.oninput=e=>set(e.target.value)});calc()}function calc(){let d=x.d,r=x.r,w=x.w;if(m==='width')w=d/r;else if(m==='ratio')r=d/w;else d=r*w;let [aa,b]=a.split(':').map(Number),h=w*b/aa,di=Math.hypot(w,h);let L=m==='width'?['Amplada',f(w)+' m']:m==='ratio'?['Relació de tir',f(r)+':1']:['Distància',f(d)+' m'];document.querySelector('#rl').textContent=L[0];document.querySelector('#r').textContent=L[1];document.querySelector('#hl').textContent='Alçada '+a;document.querySelector('#dl').textContent='Diagonal '+a;document.querySelector('#h').textContent=f(h)+' m';document.querySelector('#diag').textContent=f(di)+' m';document.querySelector('#formula').textContent=m==='width'?`Amplada = distància ÷ òptica  ·  ${f(d)} ÷ ${f(r)} = ${f(w)} m`:m==='ratio'?`Òptica = distància ÷ amplada  ·  ${f(d)} ÷ ${f(w)} = ${f(r)}:1`:`Distància = òptica × amplada  ·  ${f(r)} × ${f(w)} = ${f(d)} m`}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{a=b.dataset.a;document.querySelectorAll('[data-a]').forEach(q=>q.classList.toggle('active',q===b));calc()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;document.querySelectorAll('[data-m]').forEach(q=>q.classList.toggle('active',q===b));render()});render();</script></body></html>
