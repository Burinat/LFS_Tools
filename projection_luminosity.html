<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lúmens per façana</title><style>
:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff;--warn:#ffc66d;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}.section-title{font-size:1rem;color:var(--accent);margin:0 0 16px}.field{margin:0 0 20px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num,.select{border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;font-size:1rem}.num{width:94px;text-align:right}.select{width:100%}.unit{width:42px;color:var(--muted)}.note{margin:7px 0 0;color:var(--muted);font-size:.82rem}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.pill{border:1px solid var(--line);border-radius:10px;background:#0b131a;color:var(--text);padding:9px 11px;cursor:pointer}.pill.active{border-color:var(--accent);background:#12332f;color:#d9fff5}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.result .k{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.45rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.wide{grid-column:span 3}.state{border-radius:12px;padding:13px 15px;font-weight:700;background:#102c2a;color:var(--accent)}.state.warn{background:#332a15;color:var(--warn)}.state.bad{background:#35191d;color:var(--bad)}.formula{color:var(--muted);font-size:.88rem;line-height:1.45;margin:18px 0 0}@media(max-width:700px){body{padding:14px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.card{padding:16px}.split,.results{grid-template-columns:1fr}.wide{grid-column:auto}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}}</style></head><body><main class="app"><header class="head"><div><h1>Lúmens per façana</h1><p>Geometria de projecció, cobertura, blending i lux estimats.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="split"><div><h2 class="section-title">Façana i condicions</h2><div id="facadeFields"></div><div class="field"><label>Nivell de lux objectiu</label><select class="select" id="target"><option value="100">Molt fosc · 100 lux</option><option value="300" selected>Urbà moderat · 300 lux</option><option value="700">Urbà amb molta llum · 700 lux</option><option value="1200">Exterior exigent · 1.200 lux</option></select></div></div><div><h2 class="section-title">Projectors</h2><div class="pills"><button class="pill active" data-aspect="16:9">16:9</button><button class="pill" data-aspect="16:10">16:10</button></div><div class="pills"><button class="pill active" data-layout="horizontal">En línia horitzontal</button><button class="pill" data-layout="vertical">En línia vertical</button><button class="pill" data-layout="stacked">Apilats</button></div><div id="projectorFields"></div></div></div><div class="results"><div class="result"><div class="k">Imatge per projector</div><div id="image" class="v">—</div></div><div class="result"><div class="k">Superfície per projector</div><div id="projArea" class="v">—</div></div><div class="result"><div class="k">Lux per projector</div><div id="projLux" class="v">—</div></div><div class="result"><div class="k">Cobertura total</div><div id="coverage" class="v">—</div></div><div class="result"><div class="k">Façana coberta</div><div id="coveragePct" class="v">—</div></div><div class="result"><div class="k">Lux efectius estimats</div><div id="lux" class="v">—</div></div><div class="wide state" id="state">—</div></div><p class="formula" id="formula">—</p></section></main><script>
let aspect='16:9',layout='horizontal';
const x={fw:20,fh:10,distance:20,throw:1.5,lumens:20000,projectors:2,blend:10};
const facade=[['fw','Amplada de la façana','m',1,100,.1],['fh','Alçada de la façana','m',1,50,.1]];
const projector=[['distance','Distància projector → façana','m',1,100,.1],['throw','Relació de tir',':1',.3,5,.01],['lumens','Potència per projector','ANSI lm',1000,60000,100],['projectors','Nombre de projectors','',1,12,1],['blend','Blend','%',0,40,1]];
const fmt=v=>(Math.round(Number(v)*100)/100).toLocaleString('ca-ES',{maximumFractionDigits:2});
function build(id,defs){const b=document.querySelector(id);b.innerHTML='';defs.forEach(([key,label,unit,min,max,step])=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${label}<output>${fmt(x[key])} ${unit}</output></label><div class="row"><input type="range" min="${min}" max="${max}" step="${step}" value="${x[key]}"><input class="num" type="number" min="${min}" max="${max}" step="${step}" value="${x[key]}"><span class="unit">${unit}</span></div><p class="note">Rang: ${fmt(min)}–${fmt(max)} ${unit}</p>`;b.append(d);const r=d.querySelector('input[type=range]'),n=d.querySelector('.num'),o=d.querySelector('output');const set=v=>{x[key]=Math.max(min,Math.min(max,Number(v)||min));r.value=x[key];n.value=x[key];o.textContent=fmt(x[key])+' '+unit;calc()};r.oninput=e=>set(e.target.value);n.oninput=e=>set(e.target.value)})}
function calc(){const [aw,ah]=aspect.split(':').map(Number);const pw=x.distance/x.throw,ph=pw*ah/aw,pa=pw*ph,pl=x.lumens/pa,facadeArea=x.fw*x.fh,blend=x.blend/100;let cw,ch,coveredArea,lux;if(layout==='horizontal'){cw=x.projectors*pw-(x.projectors-1)*pw*blend;ch=ph;coveredArea=cw*ch;lux=pl}else if(layout==='vertical'){cw=pw;ch=x.projectors*ph-(x.projectors-1)*ph*blend;coveredArea=cw*ch;lux=pl}else{cw=pw;ch=ph;coveredArea=pa;lux=pl*x.projectors}const interW=Math.max(0,Math.min(cw,x.fw)),interH=Math.max(0,Math.min(ch,x.fh)),coveredFacade=Math.min(facadeArea,interW*interH),pct=coveredFacade/facadeArea*100,target=Number(document.querySelector('#target').value);image.textContent=fmt(pw)+' × '+fmt(ph)+' m';projArea.textContent=fmt(pa)+' m²';projLux.textContent=fmt(pl)+' lux';coverage.textContent=fmt(cw)+' × '+fmt(ch)+' m';coveragePct.textContent=fmt(pct)+' %';lux.textContent=fmt(lux)+' lux';const state=document.querySelector('#state');let msg='',cls='state';if(pct<99.5){msg='Cobertura insuficient: la geometria projectada no cobreix tota la façana.';cls+=' bad'}else if(lux<target){msg='Cobertura correcta, però el nivell de lux és inferior a l’objectiu seleccionat.';cls+=' warn'}else{msg='Cobertura correcta i nivell de lux igual o superior a l’objectiu.'}state.className=cls;state.textContent=msg;formula.textContent=`Imatge per projector: distància ÷ relació de tir = ${fmt(x.distance)} ÷ ${fmt(x.throw)} = ${fmt(pw)} m. Lux per projector: ANSI lm ÷ superfície projectada = ${fmt(x.lumens)} ÷ ${fmt(pa)} = ${fmt(pl)} lux. ${layout==='stacked'?'En apilat, els lux se sumen sobre la mateixa zona.':'En mosaic, cada projector il·lumina una zona; els lux no se sumen sobre tota la façana.'}`}
document.querySelectorAll('[data-aspect]').forEach(b=>b.onclick=()=>{aspect=b.dataset.aspect;document.querySelectorAll('[data-aspect]').forEach(q=>q.classList.toggle('active',q===b));calc()});document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(q=>q.classList.toggle('active',q===b));calc()});target.onchange=calc;build('#facadeFields',facade);build('#projectorFields',projector);calc();
</script></body></html>
