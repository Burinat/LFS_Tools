<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de projecció</title><style>
:root{--bg:#080c11;--card:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--accent2:#82adff}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:850px;margin:auto}.header{margin-bottom:18px}.header h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 6px}.header p{margin:0;color:var(--muted)}.card{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 15px 40px #0005}.format{display:flex;gap:18px;align-items:center;margin:-4px 0 22px;padding:11px 13px;background:#0b131a;border:1px solid var(--line);border-radius:12px}.format-title{color:var(--muted);font-size:.9rem}.radio{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:650}.radio input{accent-color:var(--accent);width:17px;height:17px;cursor:pointer}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 25px}.mode{border:1px solid var(--line);background:#0c131a;color:var(--text);border-radius:12px;padding:12px 10px;cursor:pointer;font-size:.93rem;line-height:1.25}.mode.active{border-color:var(--accent);background:#12332f;color:#d9fff5;box-shadow:inset 0 0 0 1px var(--accent)}.fields{display:grid;gap:22px}.field label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-weight:650}.field output{font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--accent)}.field input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.range-row{display:flex;align-items:center;gap:12px}.number{width:92px;border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px 8px;text-align:right;font-size:1rem}.unit{color:var(--muted);width:32px}.hint{color:var(--muted);font-size:.82rem;margin:7px 0 0}.results{margin-top:25px;border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#0b131a;border:1px solid var(--line);border-radius:13px;padding:15px}.result .label{color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}.result .value{font-size:1.65rem;font-weight:750;margin-top:5px;color:var(--accent2);font-variant-numeric:tabular-nums}.formula{color:var(--muted);font-size:.87rem;margin:17px 0 0;text-align:center}.reset{display:block;margin:20px auto 0;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;cursor:pointer}.reset:hover{border-color:var(--accent);color:var(--accent)}@media(max-width:600px){body{padding:14px}.card{padding:16px}.modes,.results{grid-template-columns:1fr}.format{flex-wrap:wrap;gap:10px 17px}.format-title{width:100%}.mode{padding:11px}.results{gap:9px}.result{display:flex;justify-content:space-between;align-items:center}.result .value{margin:0}}
</style></head><body><main class="app"><header class="header"><h1>Calculadora de projecció</h1><p>Relació de tir, distància i amplada d'imatge.</p></header><section class="card"><fieldset class="format"><legend class="format-title">Format de projecció</legend><label class="radio"><input type="radio" name="format" value="16:9" checked> 16:9</label><label class="radio"><input type="radio" name="format" value="16:10"> 16:10</label></fieldset><div class="modes" role="tablist"><button class="mode active" data-mode="width">Distància + òptica<br><strong>→ Amplada</strong></button><button class="mode" data-mode="ratio">Amplada + distància<br><strong>→ Òptica</strong></button><button class="mode" data-mode="distance">Òptica + amplada<br><strong>→ Distància</strong></button></div><div id="fields" class="fields"></div><div class="results"><div class="result"><div class="label">Resultat</div><div id="result" class="value">—</div></div><div class="result"><div class="label" id="heightLabel">Alçada 16:9</div><div id="height" class="value">—</div></div><div class="result"><div class="label" id="diagLabel">Diagonal 16:9</div><div id="diag" class="value">—</div></div></div><p id="formula" class="formula"></p><button id="reset" class="reset">Restablir valors</button></section></main><script>
const data={distance:{label:'Distància de projecció',unit:'m',min:.5,max:50,step:.1,value:8},ratio:{label:'Relació de tir',unit:':1',min:.3,max:5,step:.01,value:1.5},width:{label:"Amplada d'imatge",unit:'m',min:.2,max:30,step:.1,value:5}};let mode='width',aspect='16:9';const f=v=>{const n=Number(v);return(Math.round(n*100)/100).toLocaleString('ca-ES',{minimumFractionDigits:0,maximumFractionDigits:2})};function fieldsNeeded(){return mode==='width'?['distance','ratio']:mode==='ratio'?['width','distance']:['ratio','width']}function render(){const box=document.querySelector('#fields');box.innerHTML='';fieldsNeeded().forEach(k=>{const x=data[k],id='input-'+k,div=document.createElement('div');div.className='field';div.innerHTML=`<label for="${id}">${x.label}<output>${f(x.value)} ${x.unit}</output></label><div class="range-row"><input type="range" id="${id}" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.value}"><input class="number" aria-label="${x.label}" type="number" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.value}"><span class="unit">${x.unit}</span></div><p class="hint">Rang: ${f(x.min)}–${f(x.max)} ${x.unit}</p>`;box.append(div);const range=div.querySelector('input[type=range]'),num=div.querySelector('.number'),out=div.querySelector('output');function set(v){v=Math.min(x.max,Math.max(x.min,Number(v)||x.min));x.value=v;range.value=v;num.value=v;out.textContent=f(v)+' '+x.unit;calculate()}range.oninput=e=>set(e.target.value);num.oninput=e=>set(e.target.value)});calculate()}function calculate(){let d=data.distance.value,r=data.ratio.value,w=data.width.value;if(mode==='width')w=d/r;else if(mode==='ratio')r=d/w;else d=r*w;const p=aspect.split(':').map(Number),h=w*p[1]/p[0],diagonal=Math.hypot(w,h);document.querySelector('#result').textContent=mode==='ratio'?f(r)+':1':f(mode==='distance'?d:w)+' m';document.querySelector('#heightLabel').textContent='Alçada '+aspect;document.querySelector('#diagLabel').textContent='Diagonal '+aspect;document.querySelector('#height').textContent=f(h)+' m';document.querySelector('#diag').textContent=f(diagonal)+' m';document.querySelector('#formula').textContent=mode==='width'?`Fórmula: amplada = distància ÷ relació de tir (${f(d)} ÷ ${f(r)} = ${f(w)} m)`:mode==='ratio'?`Fórmula: relació de tir = distància ÷ amplada (${f(d)} ÷ ${f(w)} = ${f(r)}:1)`: `Fórmula: distància = relació de tir × amplada (${f(r)} × ${f(w)} = ${f(d)} m)`}document.querySelectorAll('input[name=format]').forEach(x=>x.onchange=()=>{aspect=x.value;calculate()});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#reset').onclick=()=>{data.distance.value=8;data.ratio.value=1.5;data.width.value=5;render()};render();
</script></body></html>
