<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capacitat de connector</title><style>:root{--bg:#080c11;--panel:#101820;--line:#2a3b4b;--text:#e9f2f8;--muted:#9aabba;--accent:#4ed9b5;--blue:#82adff;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#173244 0,transparent 35%),var(--bg);color:var(--text);padding:24px}.app{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem)}.head p{margin:7px 0 0;color:var(--muted)}.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;white-space:nowrap}.card,.result{background:rgba(16,24,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 40px #0004}.field{margin:0 0 22px}.field label{display:flex;justify-content:space-between;gap:14px;margin-bottom:9px;font-weight:700}.field output{color:var(--accent);font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1;accent-color:var(--accent)}.num,.select{border:1px solid var(--line);border-radius:9px;background:#091017;color:var(--text);padding:9px;font-size:1rem}.num{width:96px;text-align:right}.select{width:100%}.unit{width:36px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result .k{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.result .v{font-size:1.5rem;font-weight:750;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:10px;background:#0b131a;color:var(--text);padding:10px 12px;cursor:pointer}.pill.active{border-color:var(--accent);background:#12332f;color:#d9fff5}.formula{color:var(--muted);text-align:center;margin:17px 0 0}.compat-title{margin:28px 0 12px;font-size:1.1rem}.compat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cable{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0b131a}.cable .name{font-weight:700}.cable .cap{margin-top:4px;color:var(--muted);font-size:.86rem}.cable.ok{border-color:var(--accent);background:#102c2a}.cable.ok .status{color:var(--accent)}.cable.no{border-color:#633337;background:#25161a}.cable.no .status{color:var(--red)}.status{font-size:.85rem;margin-top:8px;font-weight:700}@media(max-width:600px){body{padding:14px}.card{padding:16px}.head{display:block}.back{display:inline-block;margin-bottom:16px}.grid,.compat{grid-template-columns:1fr}.result{display:flex;justify-content:space-between;align-items:center;padding:14px}.result .v{margin:0}}</style></head><body><main class="app"><header class="head"><div><h1>Capacitat de connector</h1><p>Estimació d'ample de banda de vídeo sense compressió.</p></div><a class="back" href="index.html">← Eines</a></header><section class="card"><div class="field"><label>Resolució</label><select id="res" class="select"><option value="1920,1080">FHD · 1920 × 1080</option><option value="2560,1440">QHD · 2560 × 1440</option><option value="3840,2160" selected>4K UHD · 3840 × 2160</option><option value="7680,4320">8K UHD · 7680 × 4320</option></select></div><div class="field"><label>Freqüència <output id="hzout">60 Hz</output></label><div class="row"><input id="hz" type="range" min="24" max="240" step="1" value="60"><input id="hzn" class="num" type="number" min="24" max="240" value="60"><span class="unit">Hz</span></div></div><div class="field"><label>Profunditat de color</label><select id="bit" class="select"><option value="8">8-bit</option><option value="10" selected>10-bit</option><option value="12">12-bit</option></select></div><div class="field"><label>Submostreig</label><select id="sub" class="select"><option value="3">4:4:4</option><option value="2">4:2:2</option><option value="1.5">4:2:0</option></select></div><div class="grid"><div class="result"><div class="k">Dades actives</div><div id="gbps" class="v">—</div></div><div class="result"><div class="k">Amb marge 20%</div><div id="over" class="v">—</div></div><div class="result"><div class="k">Píxels per segon</div><div id="pps" class="v">—</div></div></div><p class="formula">La compatibilitat es compara contra el requisit amb un marge del 20%. Els valors són capacitats màximes teòriques de payload.</p><h2 class="compat-title">Compatibilitat de connectors</h2><div id="compat" class="compat"></div></section></main><script>const cables=[['HDMI 1.0',3.96],['HDMI 1.2',7.92],['HDMI 1.3 / 1.4',8.16],['HDMI 2.0',14.4],['HDMI 2.1 (FRL)',42.67],['DisplayPort 1.1',8.64],['DisplayPort 1.2',17.28],['DisplayPort 1.3 / 1.4',25.92],['DisplayPort 2.0 / 2.1 UHBR10',38.69],['DisplayPort 2.1 UHBR13.5',52.22],['DisplayPort 2.1 UHBR20',77.37],['SDI 3G',2.97],['SDI 6G',5.94],['SDI 12G',11.88]];const f=v=>v.toLocaleString('ca-ES',{maximumFractionDigits:2});function calc(){let [w,h]=res.value.split(',').map(Number),fr=+hz.value,b=+bit.value,s=+sub.value,pps=w*h*fr,active=pps*b*s/1e9,need=active*1.2;hzout.textContent=fr+' Hz';gbps.textContent=f(active)+' Gbps';over.textContent=f(need)+' Gbps';document.querySelector('#pps').textContent=f(pps/1e6)+' Mpx/s';compat.innerHTML=cables.map(([n,c])=>{let ok=c>=need;return `<article class="cable ${ok?'ok':'no'}"><div class="name">${n}</div><div class="cap">${f(c)} Gbps útils</div><div class="status">${ok?'✓ Compatible':'✕ Insuficient'}</div></article>`}).join('')}hz.oninput=e=>{hzn.value=e.target.value;calc()};hzn.oninput=e=>{hz.value=Math.max(24,Math.min(240,e.target.value||24));calc()};['res','bit','sub'].forEach(id=>document.querySelector('#'+id).onchange=calc);calc();</script></body></html>
